<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-primary": "#c8c6c5", "secondary": "#5e5e5e", "on-tertiary-fixed-variant": "#46474b", "surface-bright": "#f9f9fb", "secondary-container": "#e1dfdf", "error-container": "#ffdad6", "outline-variant": "#c4c7c7", "on-surface": "#1a1c1d", "primary-container": "#1c1b1b", "surface-tint": "#5f5e5e", "surface-container-low": "#f3f3f5", "surface-container": "#edeef0", "tertiary-fixed": "#e3e2e7", "error": "#ba1a1a", "on-tertiary-container": "#838388", "surface-variant": "#e2e2e4", "secondary-fixed-dim": "#c7c6c6", "primary-fixed": "#e5e2e1", "on-primary-fixed-variant": "#474646", "on-primary": "#ffffff", "primary-fixed-dim": "#c8c6c5", "on-error-container": "#93000a", "on-error": "#ffffff", "surface-container-high": "#e8e8ea", "tertiary-fixed-dim": "#c6c6cb", "secondary-fixed": "#e4e2e2", "primary": "#000000", "on-secondary-fixed": "#1b1c1c", "inverse-on-surface": "#f0f0f2", "on-background": "#1a1c1d", "surface-container-lowest": "#ffffff", "surface": "#f9f9fb", "tertiary": "#000000", "outline": "#747878", "on-secondary-fixed-variant": "#464747", "on-secondary-container": "#626262", "on-secondary": "#ffffff", "inverse-surface": "#2f3132", "on-primary-container": "#858383", "surface-container-highest": "#e2e2e4", "on-surface-variant": "#444748", "tertiary-container": "#1a1b1f", "background": "#f9f9fb", "surface-dim": "#d9dadc", "on-primary-fixed": "#1c1b1b", "on-tertiary": "#ffffff", "on-tertiary-fixed": "#1a1b1f" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "gutter-sm": "1rem", "space-sm": "0.5rem", "margin-sm": "1rem", "margin": "2rem", "space-md": "1rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "gutter": "1.5rem", "space-lg": "1.5rem" }, fontFamily: { "headline-sm": ["Manrope"], "body-md": ["Hanken Grotesk"], "display-lg": ["Manrope"], "headline-lg-mobile": ["Manrope"], "headline-lg": ["Manrope"], "headline-md": ["Manrope"], "body-sm": ["Hanken Grotesk"], "display-lg-mobile": ["Manrope"], "body-lg": ["Hanken Grotesk"], "label-md": ["Hanken Grotesk"], "label-sm": ["Hanken Grotesk"], "caption": ["Hanken Grotesk"] }, fontSize: { "headline-sm": ["1.125rem", { "lineHeight": "1.625rem", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["1rem", { "lineHeight": "1.5rem", "letterSpacing": "0em", "fontWeight": "400" }], "display-lg": ["3.5rem", { "lineHeight": "4rem", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-lg-mobile": ["1.75rem", { "lineHeight": "2.25rem", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-lg": ["2.25rem", { "lineHeight": "2.75rem", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-md": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.015em", "fontWeight": "600" }], "body-sm": ["0.875rem", { "lineHeight": "1.325rem", "letterSpacing": "0.005em", "fontWeight": "400" }], "display-lg-mobile": ["2.25rem", { "lineHeight": "2.75rem", "letterSpacing": "-0.025em", "fontWeight": "700" }], "body-lg": ["1.125rem", { "lineHeight": "1.7rem", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-md": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "600" }], "label-sm": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.02em", "fontWeight": "600" }], "caption": ["0.6875rem", { "lineHeight": "0.875rem", "letterSpacing": "0.04em", "fontWeight": "500" }] } } } }</script><style>@layer base { .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } html, body { background-color: #f9f9fb; -webkit-tap-highlight-color: transparent; } }</style></head><body class="min-h-full bg-surface text-on-surface flex flex-col font-body-md text-body-md"><main class="flex-1 w-full bg-surface pt-safe pb-safe px-gutter flex flex-col"><div class="flex flex-col w-full pb-safe space-y-space-md">
<!-- Minimalist Child Header & Activity State -->
<div class="w-full flex items-center justify-between">
<!-- Discrete Stepper Dots -->
<div aria-label="Progress: Step 3 of 5" class="flex items-center space-x-space-xs">
<span class="w-2.5 h-2.5 rounded-full bg-primary inline-block transition-transform hover:scale-110"></span>
<span class="w-2.5 h-2.5 rounded-full bg-primary inline-block transition-transform hover:scale-110"></span>
<!-- Active Step Indicator -->
<span class="relative flex items-center justify-center w-4 h-4">
<span class="absolute inset-0 rounded-full bg-secondary-container animate-pulse"></span>
<span class="w-2.5 h-2.5 rounded-full bg-primary relative z-10"></span>
</span>
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-high inline-block"></span>
<span class="w-2.5 h-2.5 rounded-full bg-surface-container-high inline-block"></span>
</div>
<!-- Take a Break Pause Pill -->
<button aria-label="Take a break" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-surface-container-lowest text-on-surface shadow-sm active:scale-95 transition-all text-label-sm font-label-sm" id="pauseBtn">
<span class="material-symbols-outlined text-caption" style="font-size: 14px;">pause</span>
<span>Take a Break</span>
</button>
</div>
<!-- Robot Mascot & Conversational iOS Speech Bubble -->
<div class="w-full flex items-start space-x-space-sm pt-space-xs">
<!-- Friendly Geometric Mascot Icon in Soft Squircle -->
<div class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-lowest flex items-center justify-center shadow-sm relative overflow-hidden group">
<svg class="w-7 h-7 text-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 28 28">
<!-- Robot Head -->
<rect fill="#f9f9fb" height="16" rx="5" width="20" x="4" y="6"></rect>
<!-- Antenna -->
<line stroke-width="2" x1="14" x2="14" y1="2" y2="6"></line>
<circle cx="14" cy="2" fill="currentColor" r="1.5"></circle>
<!-- Friendly Eyes -->
<circle cx="9.5" cy="13.5" fill="currentColor" r="1.75"></circle>
<circle cx="18.5" cy="13.5" fill="currentColor" r="1.75"></circle>
<!-- Gentle Smile -->
<path d="M10.5 17.5C11.8 19 16.2 19 17.5 17.5" stroke-width="1.6"></path>
<!-- Little Ears -->
<line stroke-width="2" x1="1.5" x2="4" y1="14" y2="14"></line>
<line stroke-width="2" x1="24" x2="26.5" y1="14" y2="14"></line>
</svg>
<div class="absolute bottom-0 w-full h-1 bg-surface-variant"></div>
</div>
<!-- Calm Speech Bubble -->
<div class="relative flex-1 bg-surface-container-lowest p-3.5 rounded-2xl rounded-tl-sm shadow-sm">
<p class="font-headline-sm text-headline-sm text-on-surface tracking-tight leading-snug">
        Trace the path and connect letter <span class="font-bold underline decoration-2 underline-offset-2">A</span> to <span class="font-bold underline decoration-2 underline-offset-2">B</span> smoothly!
      </p>
</div>
</div>
<!-- Audio Accessibility & Reassurance Bar -->
<div class="w-full flex items-center justify-between px-1">
<button aria-label="Hear Instructions aloud" class="inline-flex items-center space-x-2 px-3 py-1.5 rounded-full bg-surface-container text-on-surface hover:bg-surface-variant active:scale-95 transition-all text-label-sm font-label-sm shadow-sm" id="audioPromptBtn">
<span class="material-symbols-outlined text-body-md" style="font-size: 18px;">volume_up</span>
<span>Hear Instructions</span>
</button>
<div class="flex items-center space-x-1.5 text-secondary">
<span class="material-symbols-outlined text-caption" style="font-size: 14px;">spa</span>
<span class="font-caption text-caption uppercase tracking-wider">Take your time • No rush</span>
</div>
</div>
<!-- Interactive Assessment Canvas Module -->
<div class="w-full relative bg-surface-container-lowest rounded-3xl shadow-sm p-4 flex flex-col items-center justify-between select-none overflow-hidden" style="min-height: 380px;">
<!-- Subtle Dot Grid Background (SVG Pattern) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none opacity-40" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="2" cy="2" fill="#747878" opacity="0.4" r="1.1"></circle>
</pattern>
</defs>
<rect fill="url(#dotGrid)" height="100%" width="100%"></rect>
</svg>
<!-- Top Canvas Status & Micro Toolbar -->
<div class="w-full flex items-center justify-between z-10">
<div class="inline-flex items-center space-x-1.5 bg-surface-container-low px-2.5 py-1 rounded-full text-caption font-caption text-secondary">
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
<span>Fine-Motor Assessment</span>
</div>
<!-- Canvas Utility Toolbar -->
<div class="flex items-center space-x-1 bg-surface-container-low p-1 rounded-full shadow-inner">
<button class="w-7 h-7 rounded-full flex items-center justify-center text-secondary hover:text-on-surface active:scale-90 transition-transform" id="undoBtn" title="Undo trace">
<span class="material-symbols-outlined text-label-md" style="font-size: 17px;">undo</span>
</button>
<button class="w-7 h-7 rounded-full flex items-center justify-center text-secondary hover:text-on-surface active:scale-90 transition-transform" id="clearBtn" title="Clear canvas">
<span class="material-symbols-outlined text-label-md" style="font-size: 17px;">close</span>
</button>
<div class="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm" title="Drawing Tool Active">
<span class="material-symbols-outlined text-label-md" style="font-size: 16px;">edit</span>
</div>
</div>
</div>
<!-- Active Task Drawing Surface -->
<div class="relative w-full flex-1 flex items-center justify-center py-4 my-2 z-10 touch-none" id="drawingArea">
<svg class="w-full h-64 overflow-visible" fill="none" viewbox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gentle Motion / Guideline markers -->
<marker id="guideArrow" markerheight="6" markerwidth="6" orient="auto" refx="3" refy="3">
<path d="M1 1L5 3L1 5" fill="none" stroke="#747878" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"></path>
</marker>
</defs>
<!-- Dynamic Guidance Path (Dashed Curving Track with subtle chevron hints) -->
<path class="opacity-70" d="M 52 160 C 100 175, 120 60, 185 85 C 225 102, 235 70, 268 56" stroke="#e2e2e4" stroke-linecap="round" stroke-width="14"></path>
<path d="M 52 160 C 100 175, 120 60, 185 85 C 225 102, 235 70, 268 56" stroke="#747878" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="1.8"></path>
<!-- Directional Flow Indicators -->
<circle cx="118" cy="115" fill="#747878" r="1.5"></circle>
<circle cx="196" cy="89" fill="#747878" r="1.5"></circle>
<!-- Simulated Active Child Trace Segment (Hand-drawn organic curve with subtle tapering) -->
<path class="transition-all duration-300" d="M 52 160 C 72 165, 88 171, 102 164 C 114 158, 120 135, 127 105 C 132 87, 140 76, 155 77" id="userTrace" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"></path>
<!-- Active Tip / Stylus Position Halo -->
<g id="stylusTip" transform="translate(155, 77)">
<circle class="animate-ping" cx="0" cy="0" fill="#000000" opacity="0.08" r="10"></circle>
<circle cx="0" cy="0" fill="#000000" r="5"></circle>
<circle cx="0" cy="0" fill="#ffffff" r="2"></circle>
</g>
<!-- Node 'A' (Starting Target - Solid Black Apple-style squircle circular badge) -->
<g class="cursor-pointer" transform="translate(24, 132)">
<circle class="filter drop-shadow-sm" cx="28" cy="28" fill="#000000" r="24"></circle>
<circle cx="28" cy="28" r="26" stroke="#ffffff" stroke-width="2"></circle>
<text fill="#ffffff" font-family="Manrope" font-size="20" font-weight="700" text-anchor="middle" x="28" y="36">A</text>
<!-- Start Indicator Label -->
<rect fill="#edeef0" height="16" rx="8" width="42" x="7" y="58"></rect>
<text fill="#1a1c1d" font-family="Hanken Grotesk" font-size="9" font-weight="600" text-anchor="middle" x="28" y="69.5">START</text>
</g>
<!-- Node 'B' (Destination Target - High Contrast Target Ring) -->
<g class="cursor-pointer" transform="translate(240, 28)">
<!-- Pulse Target Ring -->
<circle cx="28" cy="28" fill="none" opacity="0.8" r="27" stroke="#747878" stroke-dasharray="3 3" stroke-width="1"></circle>
<circle class="filter drop-shadow-sm" cx="28" cy="28" fill="#ffffff" r="23"></circle>
<circle cx="28" cy="28" r="23" stroke="#000000" stroke-width="2.5"></circle>
<text fill="#000000" font-family="Manrope" font-size="20" font-weight="700" text-anchor="middle" x="28" y="36">B</text>
<!-- Target Indicator Label -->
<rect fill="#edeef0" height="16" rx="8" width="38" x="9" y="57"></rect>
<text fill="#1a1c1d" font-family="Hanken Grotesk" font-size="9" font-weight="600" text-anchor="middle" x="28" y="68.5">GOAL</text>
</g>
</svg>
</div>
<!-- Fine-Motor Pressure Feedback (Low-stimulus visual confirmation) -->
<div class="w-full flex items-center justify-between text-secondary pt-1">
<div class="flex items-center space-x-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="font-caption text-caption text-secondary">Steady stroke detected</span>
</div>
<span class="font-caption text-caption text-secondary font-medium">62% Connected</span>
</div>
</div>
<!-- Bottom Ergonomic Action Area -->
<div class="w-full flex flex-col items-center space-y-space-xs pt-space-xs">
<!-- Primary Confirmation Touch Target (56pt ergonomic pill) -->
<button aria-label="Confirm trace and proceed" class="w-full h-14 rounded-full bg-primary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center space-x-2 shadow-md active:scale-[0.98] transition-all focus:outline-none" id="submitTraceBtn">
<span>I'm Finished</span>
<span class="material-symbols-outlined text-headline-sm font-bold" style="font-size: 20px;">arrow_forward</span>
</button>
<!-- Subdued Autosave Metadata -->
<div class="flex items-center justify-center space-x-1.5 py-1 text-secondary">
<span class="material-symbols-outlined text-caption" style="font-size: 13px;">cloud_done</span>
<span class="font-caption text-caption">Activity 3 of 5 • Automatically saved</span>
</div>
</div>
</div>
<script>
  (function() {
    const audioBtn = document.getElementById('audioPromptBtn');
    const userTrace = document.getElementById('userTrace');
    const clearBtn = document.getElementById('clearBtn');
    const undoBtn = document.getElementById('undoBtn');
    const stylusTip = document.getElementById('stylusTip');
    const submitBtn = document.getElementById('submitTraceBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    // Tactile Speech Audio Simulation
    let isSpeaking = false;
    audioBtn?.addEventListener('click', () => {
      isSpeaking = !isSpeaking;
      if (isSpeaking) {
        audioBtn.classList.add('bg-primary', 'text-on-primary');
        audioBtn.classList.remove('bg-surface-container', 'text-on-surface');
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance("Trace the path and connect letter A to B smoothly!");
          utterance.rate = 0.9;
          utterance.pitch = 1.05;
          utterance.onend = () => {
            audioBtn.classList.remove('bg-primary', 'text-on-primary');
            audioBtn.classList.add('bg-surface-container', 'text-on-surface');
            isSpeaking = false;
          };
          window.speechSynthesis.speak(utterance);
        }
      } else {
        audioBtn.classList.remove('bg-primary', 'text-on-primary');
        audioBtn.classList.add('bg-surface-container', 'text-on-surface');
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    });

    // Clear Canvas interaction
    clearBtn?.addEventListener('click', () => {
      if (userTrace) {
        userTrace.setAttribute('d', 'M 52 160');
      }
      if (stylusTip) {
        stylusTip.setAttribute('transform', 'translate(52, 160)');
      }
    });

    // Undo trace interaction
    undoBtn?.addEventListener('click', () => {
      if (userTrace) {
        userTrace.setAttribute('d', 'M 52 160 C 72 165, 88 171, 102 164');
      }
      if (stylusTip) {
        stylusTip.setAttribute('transform', 'translate(102, 164)');
      }
    });

    // Gentle tactile feedback on submit
    submitBtn?.addEventListener('click', () => {
      submitBtn.classList.add('scale-95');
      setTimeout(() => {
        submitBtn.classList.remove('scale-95');
      }, 150);
    });

    // Pause pill feedback
    pauseBtn?.addEventListener('click', () => {
      pauseBtn.classList.add('opacity-50');
      setTimeout(() => {
        pauseBtn.classList.remove('opacity-50');
      }, 200);
    });
  })();
</script></main></body></html>
